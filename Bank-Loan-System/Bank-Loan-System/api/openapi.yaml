openapi: 3.0.3
info:
  title: NovaBank — Online Consumer Loan API
  description: >
    REST API системы онлайн-оформления потребительского кредита цифрового банка NovaBank.
    Покрывает регистрацию, идентификацию, подачу заявки, скоринг, подписание договора,
    выдачу кредита и просмотр статуса.
  version: "1.0.0"
  contact:
    name: NovaBank IT Analysis Team
    email: analysts@novabank.example
  license:
    name: MIT

servers:
  - url: https://api.novabank.example/v1
    description: Production
  - url: https://api.staging.novabank.example/v1
    description: Staging

tags:
  - name: Auth
    description: Регистрация и аутентификация
  - name: Applications
    description: Заявки на кредит
  - name: Documents
    description: Документы клиента
  - name: Loans
    description: Кредиты и платежи

paths:
  /register:
    post:
      tags: [Auth]
      summary: Регистрация нового клиента
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email или телефон уже используется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      tags: [Auth]
      summary: Аутентификация клиента
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Учётная запись временно заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loan-application:
    post:
      tags: [Applications]
      summary: Создать заявку на кредит
      operationId: createLoanApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationRequest'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '400':
          description: Ошибка валидации (сумма/срок вне диапазона)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Клиент не идентифицирован либо имеет активную просрочку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /loan-application/{id}:
    get:
      tags: [Applications]
      summary: Получить статус заявки по ID
      operationId: getLoanApplication
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Данные заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '404':
          description: Заявка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents:
    post:
      tags: [Documents]
      summary: Загрузить документ (справка о доходах и т.д.)
      operationId: uploadDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: Документ загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Некорректный формат/размер файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /loan/{id}:
    get:
      tags: [Loans]
      summary: Получить информацию о кредите
      operationId: getLoan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID кредита
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: Данные кредита
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '404':
          description: Кредит не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments:
    get:
      tags: [Loans]
      summary: Получить график платежей / историю оплат клиента
      operationId: getPayments
      security:
        - bearerAuth: []
      parameters:
        - name: loan_id
          in: query
          required: true
          description: ID кредита, для которого запрашивается график платежей
          schema:
            type: integer
            example: 42
        - name: status
          in: query
          required: false
          description: Фильтр по статусу платежа
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Список платежей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ApplicationId:
      name: id
      in: path
      required: true
      description: ID заявки на кредит
      schema:
        type: integer
        example: 101

  responses:
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, phone, full_name, birth_date, password]
      properties:
        email:
          type: string
          format: email
          example: ivan.petrov@example.com
        phone:
          type: string
          example: "+79161234567"
        full_name:
          type: string
          example: "Петров Иван Сергеевич"
        birth_date:
          type: string
          format: date
          example: "1990-05-14"
        password:
          type: string
          format: password
          minLength: 8
          example: "SecurePass123"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 101
        email:
          type: string
        phone:
          type: string
        full_name:
          type: string
        status:
          type: string
          enum: [active, blocked, pending_verification]
        created_at:
          type: string
          format: date-time

    LoanApplicationRequest:
      type: object
      required: [requested_amount, term_months, purpose]
      properties:
        requested_amount:
          type: number
          format: double
          minimum: 10000
          maximum: 3000000
          example: 500000
        term_months:
          type: integer
          minimum: 6
          maximum: 60
          example: 24
        purpose:
          type: string
          example: "На ремонт"

    LoanApplicationResponse:
      type: object
      properties:
        id:
          type: integer
          example: 101
        user_id:
          type: integer
          example: 55
        requested_amount:
          type: number
          example: 500000
        term_months:
          type: integer
          example: 24
        purpose:
          type: string
          example: "На ремонт"
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        created_at:
          type: string
          format: date-time
        decision_date:
          type: string
          format: date-time
          nullable: true
        scoring:
          $ref: '#/components/schemas/ScoringResult'

    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - IDENTITY_VERIFIED
        - SCORING_IN_PROGRESS
        - MANUAL_REVIEW
        - APPROVED
        - DECLINED
        - CONTRACT_SIGNED
        - DISBURSED
        - CLOSED
      example: MANUAL_REVIEW

    ScoringResult:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 999
          example: 650
        decision:
          type: string
          enum: [APPROVE, DECLINE, MANUAL_REVIEW]
          example: MANUAL_REVIEW
        model_version:
          type: string
          example: "v1.0"

    DocumentUploadRequest:
      type: object
      required: [application_id, doc_type, file]
      properties:
        application_id:
          type: integer
          example: 101
        doc_type:
          type: string
          enum: [passport_scan, income_certificate, employment_certificate, other]
          example: income_certificate
        file:
          type: string
          format: binary

    DocumentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 501
        application_id:
          type: integer
          example: 101
        doc_type:
          type: string
          example: income_certificate
        file_url:
          type: string
          example: "/storage/docs/income_101.pdf"
        uploaded_at:
          type: string
          format: date-time
        verified:
          type: boolean
          example: false

    LoanResponse:
      type: object
      properties:
        id:
          type: integer
          example: 42
        application_id:
          type: integer
          example: 101
        principal_amount:
          type: number
          example: 500000
        interest_rate:
          type: number
          example: 18.9
        term_months:
          type: integer
          example: 24
        monthly_payment:
          type: number
          example: 24875.32
        status:
          type: string
          enum: [ACTIVE, OVERDUE, CLOSED, DEFAULTED]
          example: ACTIVE
        issue_date:
          type: string
          format: date
        contract_number:
          type: string
          example: "NB-2026-00042"

    PaymentStatus:
      type: string
      enum: [PLANNED, PAID, OVERDUE, DEFAULTED]

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          example: 9001
        loan_id:
          type: integer
          example: 42
        due_date:
          type: string
          format: date
        amount:
          type: number
          example: 24875.32
        paid_date:
          type: string
          format: date
          nullable: true
        paid_amount:
          type: number
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Максимальная сумма кредита — 3 000 000 ₽"
        timestamp:
          type: string
          format: date-time
